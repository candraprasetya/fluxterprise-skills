<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="dial1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="dial2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="dial3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="400" fill="url(#bg4)" rx="16"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">THREE DIALS</text>
  <text x="450" y="64" text-anchor="middle" fill="#64748b" font-size="13">Every design must declare these before building</text>

  <!-- DIAL 1: ENERGY -->
  <rect x="40" y="90" width="260" height="280" rx="12" fill="#1e293b" stroke="url(#dial1)" stroke-width="1.5" filter="url(#shadow4)"/>
  <rect x="40" y="90" width="260" height="44" rx="12" fill="#3b82f6" opacity="0.15"/>
  <text x="170" y="118" text-anchor="middle" fill="#93c5fd" font-size="16" font-weight="700">ENERGY</text>
  <text x="170" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">How hard does this design say hello?</text>

  <!-- Level 1 -->
  <rect x="60" y="175" width="220" height="50" rx="8" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="80" y="193" fill="#3b82f6" font-size="18" font-weight="800">1</text>
  <text x="105" y="193" fill="#e2e8f0" font-size="12" font-weight="600">Calm</text>
  <text x="80" y="212" fill="#64748b" font-size="10">Web: Linear, GOV.UK</text>
  <text x="80" y="224" fill="#64748b" font-size="10">Flutter: LINE, WhatsApp</text>

  <!-- Level 2 -->
  <rect x="60" y="232" width="220" height="50" rx="8" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="80" y="250" fill="#60a5fa" font-size="18" font-weight="800">2</text>
  <text x="105" y="250" fill="#e2e8f0" font-size="12" font-weight="600">Balanced</text>
  <text x="80" y="269" fill="#64748b" font-size="10">Web: Stripe, Vercel</text>
  <text x="80" y="281" fill="#64748b" font-size="10">Flutter: Cash App, Grab</text>

  <!-- Level 3 -->
  <rect x="60" y="289" width="220" height="50" rx="8" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="80" y="307" fill="#93c5fd" font-size="18" font-weight="800">3</text>
  <text x="105" y="307" fill="#e2e8f0" font-size="12" font-weight="600">Bold</text>
  <text x="80" y="326" fill="#64748b" font-size="10">Web: Awwwards, agency</text>
  <text x="80" y="338" fill="#64748b" font-size="10">Flutter: Revolut, Monzo</text>

  <!-- DIAL 2: RHYTHM -->
  <rect x="320" y="90" width="260" height="280" rx="12" fill="#1e293b" stroke="url(#dial2)" stroke-width="1.5" filter="url(#shadow4)"/>
  <rect x="320" y="90" width="260" height="44" rx="12" fill="#8b5cf6" opacity="0.15"/>
  <text x="450" y="118" text-anchor="middle" fill="#c4b5fd" font-size="16" font-weight="700">RHYTHM</text>
  <text x="450" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">How much do sections change?</text>

  <!-- Level 1 -->
  <rect x="340" y="175" width="220" height="50" rx="8" fill="#0f172a" stroke="#3b1f5e" stroke-width="1"/>
  <text x="360" y="193" fill="#8b5cf6" font-size="18" font-weight="800">1</text>
  <text x="385" y="193" fill="#e2e8f0" font-size="12" font-weight="600">Uniform</text>
  <text x="360" y="212" fill="#64748b" font-size="10">Same scaffold every screen</text>
  <text x="360" y="224" fill="#64748b" font-size="10">Predictable, consistent</text>

  <!-- Level 2 -->
  <rect x="340" y="232" width="220" height="50" rx="8" fill="#0f172a" stroke="#3b1f5e" stroke-width="1"/>
  <text x="360" y="250" fill="#a78bfa" font-size="18" font-weight="800">2</text>
  <text x="385" y="250" fill="#e2e8f0" font-size="12" font-weight="600">Balanced</text>
  <text x="360" y="269" fill="#64748b" font-size="10">Key screens break pattern</text>
  <text x="360" y="281" fill="#64748b" font-size="10">Detail with SliverAppBar</text>

  <!-- Level 3 -->
  <rect x="340" y="289" width="220" height="50" rx="8" fill="#0f172a" stroke="#3b1f5e" stroke-width="1"/>
  <text x="360" y="307" fill="#c4b5fd" font-size="18" font-weight="800">3</text>
  <text x="385" y="307" fill="#e2e8f0" font-size="12" font-weight="600">Bold</text>
  <text x="360" y="326" fill="#64748b" font-size="10">Each screen distinct</text>
  <text x="360" y="338" fill="#64748b" font-size="10">Asymmetric, mixed compositions</text>

  <!-- DIAL 3: MOTION -->
  <rect x="600" y="90" width="260" height="280" rx="12" fill="#1e293b" stroke="url(#dial3)" stroke-width="1.5" filter="url(#shadow4)"/>
  <rect x="600" y="90" width="260" height="44" rx="12" fill="#ec4899" opacity="0.15"/>
  <text x="730" y="118" text-anchor="middle" fill="#f9a8d4" font-size="16" font-weight="700">MOTION</text>
  <text x="730" y="155" text-anchor="middle" fill="#94a3b8" font-size="11">How much motion, and why?</text>

  <!-- Level 1 -->
  <rect x="620" y="175" width="220" height="50" rx="8" fill="#0f172a" stroke="#5f1a3a" stroke-width="1"/>
  <text x="640" y="193" fill="#ec4899" font-size="18" font-weight="800">1</text>
  <text x="665" y="193" fill="#e2e8f0" font-size="12" font-weight="600">Hover only</text>
  <text x="640" y="212" fill="#64748b" font-size="10">Web: CSS :hover, :active</text>
  <text x="640" y="224" fill="#64748b" font-size="10">Flutter: InkWell splash</text>

  <!-- Level 2 -->
  <rect x="620" y="232" width="220" height="50" rx="8" fill="#0f172a" stroke="#5f1a3a" stroke-width="1"/>
  <text x="640" y="250" fill="#f472b6" font-size="18" font-weight="800">2</text>
  <text x="665" y="250" fill="#e2e8f0" font-size="12" font-weight="600">Transitions</text>
  <text x="640" y="269" fill="#64748b" font-size="10">Web: scroll-reveal, fade</text>
  <text x="640" y="281" fill="#64748b" font-size="10">Flutter: Hero, AnimatedSwitcher</text>

  <!-- Level 3 -->
  <rect x="620" y="289" width="220" height="50" rx="8" fill="#0f172a" stroke="#5f1a3a" stroke-width="1"/>
  <text x="640" y="307" fill="#f9a8d4" font-size="18" font-weight="800">3</text>
  <text x="665" y="307" fill="#e2e8f0" font-size="12" font-weight="600">Choreography</text>
  <text x="640" y="326" fill="#64748b" font-size="10">Web: parallax, GSAP pin</text>
  <text x="640" y="338" fill="#64748b" font-size="10">Flutter: staggered + parallax</text>

  <!-- Watermark -->
  <text x="450" y="392" text-anchor="middle" fill="#334155" font-size="10">fluxterprise.dev  |  Created by Candra Prasetya</text>
</svg>
