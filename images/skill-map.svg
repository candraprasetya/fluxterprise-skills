<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#10b981" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#8b5cf6" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg2)" rx="16"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">SKILL MAP</text>
  <text x="450" y="64" text-anchor="middle" fill="#64748b" font-size="13">9 skills, each covers one concern</text>

  <!-- Core (center top) -->
  <rect x="340" y="85" width="220" height="64" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#glow-blue)"/>
  <text x="450" y="110" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">fluxterprise</text>
  <text x="450" y="128" text-anchor="middle" fill="#93c5fd" font-size="11">Core Gate  |  38 rules  |  5 blocks</text>
  <text x="450" y="143" text-anchor="middle" fill="#64748b" font-size="10">Always loaded</text>

  <!-- Lines from core to skills -->
  <!-- Row 1: 5 skills -->
  <line x1="370" y1="149" x2="100" y2="195" stroke="#334155" stroke-width="1"/>
  <line x1="410" y1="149" x2="280" y2="195" stroke="#334155" stroke-width="1"/>
  <line x1="450" y1="149" x2="450" y2="195" stroke="#334155" stroke-width="1"/>
  <line x1="490" y1="149" x2="620" y2="195" stroke="#334155" stroke-width="1"/>
  <line x1="530" y1="149" x2="800" y2="195" stroke="#334155" stroke-width="1"/>

  <!-- Row 1 Skills -->
  <!-- UI -->
  <rect x="30" y="195" width="140" height="70" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="100" y="218" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">ui</text>
  <text x="100" y="235" text-anchor="middle" fill="#e2e8f0" font-size="10">Visual &amp; components</text>
  <text x="100" y="250" text-anchor="middle" fill="#64748b" font-size="9">Design tokens, forms</text>

  <!-- Copywriting -->
  <rect x="210" y="195" width="140" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="280" y="218" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700">copywriting</text>
  <text x="280" y="235" text-anchor="middle" fill="#e2e8f0" font-size="10">Headlines, CTAs</text>
  <text x="280" y="250" text-anchor="middle" fill="#64748b" font-size="9">Microcopy, SEO</text>

  <!-- Human -->
  <rect x="385" y="195" width="130" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#glow-green)"/>
  <text x="450" y="218" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">human</text>
  <text x="450" y="235" text-anchor="middle" fill="#e2e8f0" font-size="10">A11y &amp; contrast</text>
  <text x="450" y="250" text-anchor="middle" fill="#64748b" font-size="9">ARIA, screen readers</text>

  <!-- Layout Mobile -->
  <rect x="550" y="195" width="140" height="70" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="620" y="218" text-anchor="middle" fill="#f9a8d4" font-size="13" font-weight="700">layoutmobile</text>
  <text x="620" y="235" text-anchor="middle" fill="#e2e8f0" font-size="10">Mobile &amp; responsive</text>
  <text x="620" y="250" text-anchor="middle" fill="#64748b" font-size="9">Breakpoints, grids</text>

  <!-- Code -->
  <rect x="730" y="195" width="140" height="70" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="800" y="218" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">code</text>
  <text x="800" y="235" text-anchor="middle" fill="#e2e8f0" font-size="10">Comment hygiene</text>
  <text x="800" y="250" text-anchor="middle" fill="#64748b" font-size="9">Clean, no slop</text>

  <!-- Row 2: 4 skills -->
  <line x1="400" y1="149" x2="200" y2="340" stroke="#334155" stroke-width="1"/>
  <line x1="450" y1="149" x2="400" y2="340" stroke="#334155" stroke-width="1"/>
  <line x1="470" y1="149" x2="580" y2="340" stroke="#334155" stroke-width="1"/>
  <line x1="500" y1="149" x2="750" y2="340" stroke="#334155" stroke-width="1"/>

  <!-- Flutter -->
  <rect x="110" y="340" width="180" height="80" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-purple)"/>
  <text x="200" y="363" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700">flutter</text>
  <text x="200" y="380" text-anchor="middle" fill="#e2e8f0" font-size="10">Dart shorthand, architecture</text>
  <text x="200" y="395" text-anchor="middle" fill="#64748b" font-size="9">Slivers, memory, cross-platform</text>
  <rect x="140" y="402" width="120" height="14" rx="7" fill="#8b5cf6" opacity="0.2"/>
  <text x="200" y="413" text-anchor="middle" fill="#c4b5fd" font-size="9">~11,000 tokens</text>

  <!-- Flutter Motion -->
  <rect x="310" y="340" width="180" height="80" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2" filter="url(#shadow2)"/>
  <text x="400" y="363" text-anchor="middle" fill="#f9a8d4" font-size="14" font-weight="700">flutter-motion</text>
  <text x="400" y="380" text-anchor="middle" fill="#e2e8f0" font-size="10">60fps, micro-interactions</text>
  <text x="400" y="395" text-anchor="middle" fill="#64748b" font-size="9">Rive, Lottie, CustomPainter</text>
  <rect x="340" y="402" width="120" height="14" rx="7" fill="#ec4899" opacity="0.2"/>
  <text x="400" y="413" text-anchor="middle" fill="#f9a8d4" font-size="9">~9,500 tokens</text>

  <!-- Testing -->
  <rect x="510" y="340" width="140" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow2)"/>
  <text x="580" y="363" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700">testing</text>
  <text x="580" y="380" text-anchor="middle" fill="#e2e8f0" font-size="10">Unit, widget, a11y</text>
  <text x="580" y="395" text-anchor="middle" fill="#64748b" font-size="9">Visual regression, CI</text>
  <rect x="530" y="402" width="100" height="14" rx="7" fill="#10b981" opacity="0.2"/>
  <text x="580" y="413" text-anchor="middle" fill="#6ee7b7" font-size="9">~4,500 tokens</text>

  <!-- Total tokens -->
  <rect x="690" y="340" width="170" height="80" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="775" y="365" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">TOTAL</text>
  <text x="775" y="385" text-anchor="middle" fill="#94a3b8" font-size="11">~50,800 tokens</text>
  <text x="775" y="405" text-anchor="middle" fill="#64748b" font-size="10">All 9 skills loaded</text>

  <!-- Token legend -->
  <rect x="30" y="460" width="840" height="36" rx="8" fill="#1e293b" opacity="0.5"/>
  <circle cx="60" cy="478" r="5" fill="#3b82f6"/>
  <text x="72" y="482" fill="#94a3b8" font-size="10">Web UI</text>
  <circle cx="170" cy="478" r="5" fill="#f59e0b"/>
  <text x="182" y="482" fill="#94a3b8" font-size="10">Copy</text>
  <circle cx="260" cy="478" r="5" fill="#10b981"/>
  <text x="272" y="482" fill="#94a3b8" font-size="10">A11y</text>
  <circle cx="340" cy="478" r="5" fill="#ec4899"/>
  <text x="352" y="482" fill="#94a3b8" font-size="10">Mobile</text>
  <circle cx="440" cy="478" r="5" fill="#8b5cf6"/>
  <text x="452" y="482" fill="#94a3b8" font-size="10">Flutter</text>
  <text x="600" y="482" fill="#475569" font-size="10">Load only what you need per session</text>

  <!-- Watermark -->
  <text x="450" y="512" text-anchor="middle" fill="#334155" font-size="10">fluxterprise.dev  |  Created by Candra Prasetya</text>
</svg>
