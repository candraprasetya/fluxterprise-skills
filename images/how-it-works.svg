<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="480" fill="url(#bg5)" rx="16"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">HOW IT WORKS</text>
  <text x="450" y="64" text-anchor="middle" fill="#64748b" font-size="13">Two modes, three steps, five blocks</text>

  <!-- Mode selector -->
  <rect x="40" y="85" width="380" height="120" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow5)"/>
  <rect x="40" y="85" width="380" height="36" rx="12" fill="#3b82f6" opacity="0.15"/>
  <text x="230" y="109" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">MODE 1: DURING</text>
  <text x="60" y="140" fill="#e2e8f0" font-size="11">Apply rules while building</text>
  <text x="60" y="156" fill="#64748b" font-size="10">Standards enforced at every step</text>
  <text x="60" y="172" fill="#64748b" font-size="10">Prevents problems before they ship</text>
  <text x="60" y="192" fill="#10b981" font-size="11" font-weight="600">Best for: new projects, client work</text>

  <rect x="480" y="85" width="380" height="120" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow5)"/>
  <rect x="480" y="85" width="380" height="36" rx="12" fill="#8b5cf6" opacity="0.15"/>
  <text x="670" y="109" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">MODE 2: AFTER</text>
  <text x="500" y="140" fill="#e2e8f0" font-size="11">Audit existing code, produce findings</text>
  <text x="500" y="156" fill="#64748b" font-size="10">Numbered list with priorities</text>
  <text x="500" y="172" fill="#64748b" font-size="10">User picks which numbers to fix</text>
  <text x="500" y="192" fill="#10b981" font-size="11" font-weight="600">Best for: existing projects, audits</text>

  <!-- 3 Steps -->
  <rect x="40" y="225" width="820" height="80" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow5)"/>
  <text x="450" y="250" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">3 STEPS (ALWAYS RUN)</text>

  <!-- Step 1 -->
  <rect x="60" y="260" width="240" height="34" rx="6" fill="#0f172a"/>
  <text x="80" y="282" fill="#3b82f6" font-size="12" font-weight="800">1</text>
  <text x="100" y="282" fill="#e2e8f0" font-size="11">Settle direction (FG-37)</text>

  <!-- Step 2 -->
  <rect x="330" y="260" width="240" height="34" rx="6" fill="#0f172a"/>
  <text x="350" y="282" fill="#8b5cf6" font-size="12" font-weight="800">2</text>
  <text x="370" y="282" fill="#e2e8f0" font-size="11">Ask before creating (FG-23)</text>

  <!-- Step 3 -->
  <rect x="600" y="260" width="240" height="34" rx="6" fill="#0f172a"/>
  <text x="620" y="282" fill="#10b981" font-size="12" font-weight="800">3</text>
  <text x="640" y="282" fill="#e2e8f0" font-size="11">Run Quality Gate</text>

  <!-- 5 Blocks -->
  <text x="450" y="335" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">QUALITY GATE: 5 BLOCKS</text>

  <!-- Block 1 -->
  <rect x="40" y="350" width="156" height="100" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="118" y="375" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">HARD GATE</text>
  <text x="118" y="395" text-anchor="middle" fill="#94a3b8" font-size="9">Em dash, mobile</text>
  <text x="118" y="410" text-anchor="middle" fill="#94a3b8" font-size="9">Fabrics, dead controls</text>
  <text x="118" y="425" text-anchor="middle" fill="#94a3b8" font-size="9">Missing states</text>
  <rect x="60" y="435" width="116" height="10" rx="5" fill="#ef4444" opacity="0.3"/>
  <rect x="60" y="435" width="116" height="10" rx="5" fill="#ef4444"/>

  <!-- Block 2 -->
  <rect x="208" y="350" width="156" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="286" y="375" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="700">PURPOSE</text>
  <text x="286" y="395" text-anchor="middle" fill="#94a3b8" font-size="9">Gradients, icons</text>
  <text x="286" y="410" text-anchor="middle" fill="#94a3b8" font-size="9">Typography, animations</text>
  <text x="286" y="425" text-anchor="middle" fill="#94a3b8" font-size="9">Must have reason</text>
  <rect x="228" y="435" width="116" height="10" rx="5" fill="#f59e0b" opacity="0.3"/>
  <rect x="228" y="435" width="80" height="10" rx="5" fill="#f59e0b"/>

  <!-- Block 3 -->
  <rect x="376" y="350" width="156" height="100" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="454" y="375" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700">CRAFT</text>
  <text x="454" y="395" text-anchor="middle" fill="#94a3b8" font-size="9">ENERGY dial</text>
  <text x="454" y="410" text-anchor="middle" fill="#94a3b8" font-size="9">RHYTHM dial</text>
  <text x="454" y="425" text-anchor="middle" fill="#94a3b8" font-size="9">MOTION dial</text>
  <rect x="396" y="435" width="116" height="10" rx="5" fill="#3b82f6" opacity="0.3"/>
  <rect x="396" y="435" width="90" height="10" rx="5" fill="#3b82f6"/>

  <!-- Block 4 -->
  <rect x="544" y="350" width="156" height="100" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="622" y="375" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="700">QUALITY</text>
  <text x="622" y="395" text-anchor="middle" fill="#94a3b8" font-size="9">Intentionality</text>
  <text x="622" y="410" text-anchor="middle" fill="#94a3b8" font-size="9">Completeness</text>
  <text x="622" y="425" text-anchor="middle" fill="#94a3b8" font-size="9">Resilience</text>
  <rect x="564" y="435" width="116" height="10" rx="5" fill="#8b5cf6" opacity="0.3"/>
  <rect x="564" y="435" width="70" height="10" rx="5" fill="#8b5cf6"/>

  <!-- Block 5 -->
  <rect x="712" y="350" width="148" height="100" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="786" y="375" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">PERF</text>
  <text x="786" y="395" text-anchor="middle" fill="#94a3b8" font-size="9">LCP &lt; 2.5s</text>
  <text x="786" y="410" text-anchor="middle" fill="#94a3b8" font-size="9">60fps (Flutter)</text>
  <text x="786" y="425" text-anchor="middle" fill="#94a3b8" font-size="9">axe-core pass</text>
  <rect x="732" y="435" width="108" height="10" rx="5" fill="#10b981" opacity="0.3"/>
  <rect x="732" y="435" width="60" height="10" rx="5" fill="#10b981"/>

  <!-- Watermark -->
  <text x="450" y="472" text-anchor="middle" fill="#334155" font-size="10">fluxterprise.dev  |  Created by Candra Prasetya</text>
</svg>
